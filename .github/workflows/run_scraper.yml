name: Run Habesha Spotify Tracker Scraper

on:
  schedule:
    - cron: '0 6 * * *' # Runs automatically every day at 6:00 AM UTC
  workflow_dispatch:     # Enables the green manual run button
  
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spotipy gspread oauth2client requests beautifulsoup4

      - name: Execute scraper script
        env:
          GCP_SA_KEY: ${{ secrets.GSPREAD_CREDENTIALS }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        run: python scraper.py
