name: Run Habesha Spotify Tracker Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at 12:00 AM UTC
  workflow_dispatch:     # Enables manual execution button

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread oauth2client

      - name: Execute scraper script
        env:
          GCP_SA_KEY: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python scraper.py
