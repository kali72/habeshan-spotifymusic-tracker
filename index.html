<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Music Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Habesha Music Leaderboard</h1>
      <p>Top Ethiopian and Eritrean tracks across eras</p>
      <div style="margin-top: 1rem;">
        <button id="theme-toggle" class="theme-toggle">☀️ Light Mode</button>
      </div>
    </header>

    <!-- Jump Navigation Bar -->
    <nav class="tabs">
      <a href="#top-15-artists" class="nav-btn">Top 15 Artists</a>
      <a href="#all-time-tracks" class="nav-btn">All-Time Tracks</a>
      <a href="#weekly-top-10" class="nav-btn">Weekly Top 10</a>
      <a href="#monthly-top-100" class="nav-btn">Monthly Top 100</a>
      <a href="#three-month-top-100" class="nav-btn">3-Month Top 100</a>
      <a href="#yearly-top-100" class="nav-btn">Yearly Top 100</a>
    </nav>

    <!-- Main Container Rendering All Charts -->
    <div id="leaderboard-container"></div>
  </div>

  <button id="back-to-top" class="back-to-top" title="Back to top">↑ Top</button>

  <script src="app.js"></script>
</body>
</html>
