<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habesha Music Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h1>Habesha Music Leaderboard</h1>
          <p>
            Tracking the most-played Ethiopian and Eritrean songs, from
            Ethio-jazz classics to what's rising this week.
          </p>
        </div>
        <button id="theme-toggle" class="theme-toggle">Dark mode</button>
      </div>
    </div>

    <div class="container">
      <nav class="tabs">
        <a href="#top-15-artists" class="nav-btn">Top 15 artists</a>
        <a href="#all-time-tracks" class="nav-btn">All-time tracks</a>
        <a href="#weekly-top-10" class="nav-btn">Weekly top 10</a>
        <a href="#monthly-top-100" class="nav-btn">Monthly top 100</a>
        <a href="#three-month-top-100" class="nav-btn">3-month top 100</a>
        <a href="#yearly-top-100" class="nav-btn">Yearly top 100</a>
      </nav>

      <main>
        <!-- Row 1: Top 15 Artists & All-Time Tracks side-by-side -->
        <div class="grid-row-2">
          <div id="section-top-15-artists"></div>
          <div id="section-all-time-tracks"></div>
        </div>

        <!-- Row 2: Weekly, Monthly, and 3-Month side-by-side -->
        <div class="grid-row-3">
          <div id="section-weekly-top-10"></div>
          <div id="section-monthly-top-100"></div>
          <div id="section-three-month-top-100"></div>
        </div>

        <!-- Row 3: Yearly alone at bottom -->
        <div class="grid-row-full">
          <div id="section-yearly-top-100"></div>
        </div>
      </main>

      <footer>
        Updated daily from Spotify · covers and artist photos via Spotify
      </footer>
    </div>

    <button id="back-to-top" class="back-to-top" title="Back to top">
      ↑ Top
    </button>

    <script src="app.js"></script>
  </body>
</html>
