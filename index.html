<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Music Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Habesha Music Leaderboard</h1>
      <p>Top Ethiopian and Eritrean tracks across eras</p>
      <div style="margin-top: 1rem;">
        <button id="theme-toggle" class="theme-toggle">☀️ Light Mode</button>
      </div>
    </header>

    <div class="tabs">
      <button data-tab="Top 15 Artists" class="active">Top 15 Artists</button>
      <button data-tab="All-Time Tracks">All-Time Tracks</button>
      <button data-tab="Weekly Top 10">Weekly Top 10</button>
      <button data-tab="Monthly Top 100">Monthly Top 100</button>
      <button data-tab="3-Month Top 100">3-Month Top 100</button>
      <button data-tab="Yearly Top 100">Yearly Top 100</button>
    </div>

    <div id="leaderboard-container"></div>
  </div>

 <!-- Floating Back to Top Button -->
  <button id="back-to-top" class="back-to-top" title="Back to top">  ↑ Top  </button>

  <script src="app.js"></script>
</body>
</body>
</html>
